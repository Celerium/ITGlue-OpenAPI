name: Generate IT Glue OpenAPI

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight UTC
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: write

concurrency:
  group: generate-itglue-openapi
  cancel-in-progress: false

jobs:
  generate-openapi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test generator
        run: python -m unittest discover -v

      - name: Generate ITGlue.yaml
        run: python docs-to-yaml.py --output ITGlue.yaml

      - name: Commit changes
        id: commit_changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add ITGlue.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore: update IT Glue OpenAPI spec"
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "No changes to commit."
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Push changes
        if: steps.commit_changes.outputs.changed == 'true'
        run: |
          git push

      # GitHub auto-disables scheduled workflows after 60 days of repository
      # inactivity. When the docs haven't changed there is no commit, so a
      # quiet period can silently disable this cron. Keep it alive with a
      # throttled empty commit on a dedicated 'keepalive' branch so that
      # main's history stays clean. Only commits when the repo has been
      # idle for a while.
      - name: Keepalive (prevent scheduled workflow auto-disable)
        if: steps.commit_changes.outputs.changed != 'true'
        run: |
          last_commit=$(git log -1 --format=%ct)
          now=$(date +%s)
          age_days=$(( (now - last_commit) / 86400 ))
          echo "Days since last commit on main: $age_days"
          if [ "$age_days" -lt 45 ]; then
            echo "Repo active within the last 45 days; no keepalive commit needed."
            exit 0
          fi
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          # Single, always-rewritten orphan commit so the keepalive branch
          # never accumulates history.
          git checkout --orphan keepalive
          git rm -rf --quiet --cached . || true
          git commit --allow-empty -m "chore: keepalive (prevent scheduled workflow auto-disable)"
          git push --force origin keepalive
